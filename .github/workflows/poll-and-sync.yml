name: Poll & Sync from CLIProxyAPI

on:
  # Run hourly; actual execution cadence is controlled by MIN_POLL_INTERVAL_MINUTES.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source_owner:
        description: Source repository owner
        required: false
        default: router-for-me
      source_repo:
        description: Source repository name
        required: false
        default: CLIProxyAPI
      source_branch:
        description: Source branch to poll
        required: false
        default: main
      msg_keywords:
        description: Regex keywords for commit message matching
        required: false
        default: iflow|qwen
      code_keywords:
        description: Regex keywords for code diff matching
        required: false
        default: iflow|qwen
      min_poll_interval_minutes:
        description: Minimum polling interval for scheduled runs
        required: false
        default: '720'
      start_since:
        description: Override start time (RFC3339, e.g. 2026-02-23T00:00:00Z)
        required: false
        default: ''
      issue_title_template:
        description: "Issue title template ({source_repo} {short_sha} {message} {reason})"
        required: false
        default: '[SourceSync][{source_repo}] {short_sha} {message}'
      issue_labels:
        description: Comma-separated labels for created issues
        required: false
        default: source-sync,automation
      doc_dir:
        description: Reference document directory
        required: false
        default: docs/source-commit-watch

permissions:
  contents: write
  issues: write

jobs:
  poll-and-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-sync-group
      cancel-in-progress: false
    env:
      SOURCE_OWNER: ${{ github.event.inputs.source_owner || vars.SOURCE_SYNC_SOURCE_OWNER || 'router-for-me' }}
      SOURCE_REPO: ${{ github.event.inputs.source_repo || vars.SOURCE_SYNC_SOURCE_REPO || 'CLIProxyAPI' }}
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_SYNC_SOURCE_BRANCH || 'main' }}
      MSG_KEYWORDS: ${{ github.event.inputs.msg_keywords || vars.SOURCE_SYNC_MSG_KEYWORDS || 'iflow|qwen' }}
      CODE_KEYWORDS: ${{ github.event.inputs.code_keywords || vars.SOURCE_SYNC_CODE_KEYWORDS || 'iflow|qwen' }}
      MIN_POLL_INTERVAL_MINUTES: ${{ github.event.inputs.min_poll_interval_minutes || vars.SOURCE_SYNC_MIN_POLL_INTERVAL_MINUTES || '720' }}
      START_SINCE: ${{ github.event.inputs.start_since || '' }}
      FALLBACK_SINCE_DATE: ${{ vars.SOURCE_SYNC_FALLBACK_SINCE_DATE || '2025-02-14T00:00:00Z' }}
      COMMITS_PER_PAGE: ${{ vars.SOURCE_SYNC_COMMITS_PER_PAGE || '100' }}
      ISSUE_TITLE_TEMPLATE: ${{ github.event.inputs.issue_title_template || vars.SOURCE_SYNC_ISSUE_TITLE_TEMPLATE || '[SourceSync][{source_repo}] {short_sha} {message}' }}
      ISSUE_LABELS: ${{ github.event.inputs.issue_labels || vars.SOURCE_SYNC_ISSUE_LABELS || 'source-sync,automation' }}
      DOC_DIR: ${{ github.event.inputs.doc_dir || vars.SOURCE_SYNC_DOC_DIR || 'docs/source-commit-watch' }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: .sync_state
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Initialize sync state
        run: |
          mkdir -p .sync_state
          [ -f .sync_state/last_success_sha ] || echo "init" > .sync_state/last_success_sha
          [ -f .sync_state/failed_shas ] || touch .sync_state/failed_shas
          [ -f .sync_state/last_polled_epoch ] || echo "0" > .sync_state/last_polled_epoch
          [ -f .sync_state/last_checked_at ] || echo "$FALLBACK_SINCE_DATE" > .sync_state/last_checked_at

      - name: Detect source default branch
        id: detect_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="main"
          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}") || API_RESPONSE=""
          if [ -n "$API_RESPONSE" ]; then
            DETECTED=$(echo "$API_RESPONSE" | jq -r '.default_branch // empty')
            if [ -n "$DETECTED" ] && [ "$DETECTED" != "null" ]; then
              DEFAULT_BRANCH="$DETECTED"
            fi
          fi
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Resolve source branch
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.source_branch }}" ]; then
            echo "SOURCE_BRANCH=${{ github.event.inputs.source_branch }}" >> "$GITHUB_ENV"
            echo "Using explicit input source branch: ${{ github.event.inputs.source_branch }}"
          elif [ -n "${{ vars.SOURCE_SYNC_SOURCE_BRANCH }}" ]; then
            echo "SOURCE_BRANCH=${{ vars.SOURCE_SYNC_SOURCE_BRANCH }}" >> "$GITHUB_ENV"
            echo "Using repo var source branch: ${{ vars.SOURCE_SYNC_SOURCE_BRANCH }}"
          else
            echo "SOURCE_BRANCH=${{ steps.detect_branch.outputs.branch }}" >> "$GITHUB_ENV"
            echo "Using detected default branch: ${{ steps.detect_branch.outputs.branch }}"
          fi

      - name: Poll + dual detection
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MATCH_FILE=".sync_reports/matched_commits.json"
          mkdir -p .sync_reports
          echo "[]" > "$MATCH_FILE"

          if ! echo "$MIN_POLL_INTERVAL_MINUTES" | grep -Eq '^[0-9]+$'; then
            echo "MIN_POLL_INTERVAL_MINUTES is invalid ($MIN_POLL_INTERVAL_MINUTES), fallback to 720"
            MIN_POLL_INTERVAL_MINUTES=720
          fi

          if ! echo "$COMMITS_PER_PAGE" | grep -Eq '^[0-9]+$' \
            || [ "$COMMITS_PER_PAGE" -lt 1 ] \
            || [ "$COMMITS_PER_PAGE" -gt 100 ]; then
            echo "COMMITS_PER_PAGE is invalid ($COMMITS_PER_PAGE), fallback to 100"
            COMMITS_PER_PAGE=100
          fi

          NOW_EPOCH=$(date +%s)
          LAST_POLLED_EPOCH=$(cat .sync_state/last_polled_epoch 2>/dev/null || echo "0")

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$LAST_POLLED_EPOCH" -gt 0 ]; then
            ELAPSED_MINUTES=$(( (NOW_EPOCH - LAST_POLLED_EPOCH) / 60 ))
            if [ "$ELAPSED_MINUTES" -lt "$MIN_POLL_INTERVAL_MINUTES" ]; then
              echo "Skip polling (elapsed ${ELAPSED_MINUTES}m < ${MIN_POLL_INTERVAL_MINUTES}m)"
              {
                echo "did_poll=false"
                echo "fetch_ok=true"
                echo "has_match=false"
                echo "match_count=0"
                echo "report_file=$MATCH_FILE"
                echo "checkpoint_time="
                echo "polled_epoch=$LAST_POLLED_EPOCH"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          LAST_CHECKED_AT=$(cat .sync_state/last_checked_at 2>/dev/null || echo "$FALLBACK_SINCE_DATE")
          if ! date -u -d "$LAST_CHECKED_AT" +"%Y-%m-%dT%H:%M:%SZ" >/dev/null 2>&1; then
            echo "Invalid last_checked_at ($LAST_CHECKED_AT), reset to fallback date."
            LAST_CHECKED_AT="$FALLBACK_SINCE_DATE"
          fi
          if [ -n "${START_SINCE:-}" ]; then
            if date -u -d "$START_SINCE" +"%Y-%m-%dT%H:%M:%SZ" >/dev/null 2>&1; then
              LAST_CHECKED_AT="$START_SINCE"
              echo "Using start_since override: $LAST_CHECKED_AT"
            else
              echo "Invalid start_since ($START_SINCE), ignoring override."
            fi
          fi

          CHECK_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "source: ${SOURCE_OWNER}/${SOURCE_REPO}@${SOURCE_BRANCH}"
          echo "time window start: $LAST_CHECKED_AT"
          echo "time window end:   $CHECK_STARTED_AT"

          git remote get-url source 2>/dev/null \
            || git remote add source "https://github.com/${SOURCE_OWNER}/${SOURCE_REPO}.git"
          git fetch source "$SOURCE_BRANCH" --quiet || git fetch source --quiet

          SINCE_DATE="$LAST_CHECKED_AT"

          echo "Syncing commits since: $SINCE_DATE"

          AUTH_HEADER=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi

          PAGE=1
          MAX_PAGES=20
          FETCH_FAILED=0
          ALL_COMMITS_FILE=$(mktemp)
          echo "[]" > "$ALL_COMMITS_FILE"

          while [ "$PAGE" -le "$MAX_PAGES" ]; do
            echo "Fetching commits page ${PAGE}..."
            PAGE_COMMITS=$(curl -sf \
              "${AUTH_HEADER[@]}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}/commits?since=${SINCE_DATE}&sha=${SOURCE_BRANCH}&per_page=${COMMITS_PER_PAGE}&page=${PAGE}") || {
                echo "Failed to fetch commits from API on page ${PAGE}."
                FETCH_FAILED=1
                break
              }

            if ! echo "$PAGE_COMMITS" | jq empty >/dev/null 2>&1; then
              echo "Invalid commits API JSON on page ${PAGE}."
              FETCH_FAILED=1
              break
            fi

            PAGE_COUNT=$(echo "$PAGE_COMMITS" | jq 'length')
            if [ "$PAGE_COUNT" -eq 0 ]; then
              break
            fi

            temp_json=$(mktemp)
            jq -s '.[0] + .[1]' "$ALL_COMMITS_FILE" <(echo "$PAGE_COMMITS") > "$temp_json"
            mv "$temp_json" "$ALL_COMMITS_FILE"

            if [ "$PAGE_COUNT" -lt "$COMMITS_PER_PAGE" ]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          if [ "$PAGE" -gt "$MAX_PAGES" ]; then
            echo "Reached MAX_PAGES (${MAX_PAGES}), probing one extra page for truncation..."
            EXTRA_PAGE_COMMITS=$(curl -sf \
              "${AUTH_HEADER[@]}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}/commits?since=${SINCE_DATE}&sha=${SOURCE_BRANCH}&per_page=${COMMITS_PER_PAGE}&page=${PAGE}") || {
                echo "Failed to probe extra page ${PAGE}."
                FETCH_FAILED=1
              }

            if [ "$FETCH_FAILED" -eq 0 ]; then
              if ! echo "$EXTRA_PAGE_COMMITS" | jq empty >/dev/null 2>&1; then
                echo "Invalid JSON while probing extra page ${PAGE}."
                FETCH_FAILED=1
              else
                EXTRA_PAGE_COUNT=$(echo "$EXTRA_PAGE_COMMITS" | jq 'length')
                if [ "$EXTRA_PAGE_COUNT" -gt 0 ]; then
                  echo "Detected more commits beyond MAX_PAGES; refusing partial window processing."
                  FETCH_FAILED=1
                fi
              fi
            fi
          fi

          if [ "$FETCH_FAILED" -ne 0 ]; then
            {
              echo "did_poll=true"
              echo "fetch_ok=false"
              echo "has_match=false"
              echo "match_count=0"
              echo "report_file=$MATCH_FILE"
              echo "checkpoint_time="
              echo "polled_epoch="
            } >> "$GITHUB_OUTPUT"
            rm -f "$ALL_COMMITS_FILE"
            exit 1
          fi

          COMMITS=$(cat "$ALL_COMMITS_FILE")
          rm -f "$ALL_COMMITS_FILE"

          LATEST_SHA=$(echo "$COMMITS" | jq -r '.[0].sha // ""')

          MATCH_COUNT=0
          COMMIT_LIST=$(echo "$COMMITS" | jq -r --arg since "$SINCE_DATE" '
            map(select((.commit.committer.date // .commit.author.date // "") > $since))
            | reverse[]
            | @base64
          ')

          while IFS= read -r row; do
            [ -z "$row" ] && continue

            data=$(echo "$row" | base64 -d)
            sha=$(echo "$data" | jq -r '.sha')
            msg=$(echo "$data" | jq -r '.commit.message | gsub("\n"; " ")')
            author=$(echo "$data" | jq -r '.commit.author.name // "unknown"')

            [ -z "$sha" ] && continue

            echo ""
            echo "================================"
            echo "Checking Commit: ${sha:0:7}"
            echo "  Message: $msg"
            echo "  Author: $author"

            FULL_DIFF=$(git show "$sha" --no-color --unified=3 2>/dev/null || echo "")
            ADDED_LINES=$(echo "$FULL_DIFF" | grep '^+' | grep -v '^+++' || true)

            MATCH_REASON=""
            if echo "$msg" | grep -qiE "$MSG_KEYWORDS"; then
              MATCH_REASON="Commit message contains keyword"
              echo " [Message match]"
            elif echo "$ADDED_LINES" | grep -qiE "$CODE_KEYWORDS"; then
              MATCH_REASON="Code changes contain keyword"
              echo " [Code match]"
            fi

            if [ -z "$MATCH_REASON" ]; then
              echo " No match, skip"
              continue
            fi

            DIFF_FILE=".sync_reports/${sha}.diff"
            printf '%s\n' "$FULL_DIFF" > "$DIFF_FILE"

            temp_json=$(mktemp)
            jq \
              --arg sha "$sha" \
              --arg short_sha "${sha:0:7}" \
              --arg msg "$msg" \
              --arg author "$author" \
              --arg reason "$MATCH_REASON" \
              --arg diff_file "$DIFF_FILE" \
              --arg source_url "https://github.com/${SOURCE_OWNER}/${SOURCE_REPO}/commit/${sha}" \
              '. += [{
                sha: $sha,
                short_sha: $short_sha,
                message: $msg,
                author: $author,
                reason: $reason,
                diff_file: $diff_file,
                source_commit_url: $source_url
              }]' \
              "$MATCH_FILE" > "$temp_json"
            mv "$temp_json" "$MATCH_FILE"

            MATCH_COUNT=$((MATCH_COUNT + 1))
            echo " Matched: ${sha:0:7} ($MATCH_REASON)"
          done <<< "$COMMIT_LIST"

          if [ -n "$LATEST_SHA" ]; then
            echo "$LATEST_SHA" > .sync_state/last_success_sha
          fi

          if [ "$MATCH_COUNT" -gt 0 ]; then
            HAS_MATCH=true
          else
            HAS_MATCH=false
          fi

          {
            echo "did_poll=true"
            echo "fetch_ok=true"
            echo "has_match=$HAS_MATCH"
            echo "match_count=$MATCH_COUNT"
            echo "report_file=$MATCH_FILE"
            echo "checkpoint_time=$CHECK_STARTED_AT"
            echo "polled_epoch=$NOW_EPOCH"
          } >> "$GITHUB_OUTPUT"

      - name: Create Issues with full diff
        if: steps.sync.outputs.has_match == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ steps.sync.outputs.report_file }}
        with:
          script: |
            const fs = require('fs');

            const reportPath = process.env.REPORT_FILE;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const renderTemplate = (template, data) =>
              String(template || '').replace(/\{([a-z_]+)\}/gi, (_, rawKey) => {
                const key = String(rawKey || '').toLowerCase();
                return String(data[key] ?? '');
              });

            if (!fs.existsSync(reportPath)) {
              core.setFailed(`Report file not found: ${reportPath}`);
              return;
            }

            const items = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const labels = String(process.env.ISSUE_LABELS || '')
              .split(',')
              .map((v) => v.trim())
              .filter(Boolean);

            core.info(`Matched commits: ${items.length}`);

            for (const item of items) {
              const sha = String(item.sha || '');
              if (!sha) continue;

              const shortSha = String(item.short_sha || sha.slice(0, 7));
              const message = String(item.message || '').replace(/\s+/g, ' ').trim();
              const marker = `source-sync-sha:${sha}`;

              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue "${marker}"`,
                per_page: 1
              });

              if (existing.data.items.length > 0) {
                core.info(`Issue already exists for ${shortSha}, skip`);
                continue;
              }

              let diffText = '';
              try {
                diffText = fs.readFileSync(item.diff_file, 'utf8');
              } catch {
                diffText = '(diff file unavailable)';
              }

              const maxDiffChars = 50000;
              const isTruncated = diffText.length > maxDiffChars;
              if (isTruncated) {
                diffText = diffText.slice(0, maxDiffChars);
              }

              const titleData = {
                source_owner: String(process.env.SOURCE_OWNER || ''),
                source_repo: String(process.env.SOURCE_REPO || ''),
                sha,
                short_sha: shortSha,
                message: message.slice(0, 120),
                author: String(item.author || ''),
                reason: String(item.reason || '')
              };

              let title = renderTemplate(process.env.ISSUE_TITLE_TEMPLATE, titleData).trim();
              if (!title) {
                title = `[SourceSync][${process.env.SOURCE_REPO}] ${shortSha} ${message.slice(0, 80)}`.trim();
              }
              if (title.length > 240) {
                title = title.slice(0, 240);
              }

              const body = [
                '## Source Sync Alert',
                `- Marker: ${marker}`,
                `- Source repo: ${process.env.SOURCE_OWNER}/${process.env.SOURCE_REPO}`,
                `- Source branch: ${process.env.SOURCE_BRANCH}`,
                `- SHA: \`${sha}\``,
                `- Author: ${item.author}`,
                `- Match reason: ${item.reason}`,
                `- Commit URL: ${item.source_commit_url}`,
                `- Reference doc path: \`${process.env.DOC_DIR}/${sha}.md\``,
                '',
                '## Full Diff',
                isTruncated ? '_Diff truncated to 50,000 chars due issue body limit._' : '',
                '```diff',
                diffText,
                '```'
              ].filter(Boolean).join('\n');

              const payload = {
                owner,
                repo,
                title,
                body
              };
              if (labels.length > 0) {
                payload.labels = labels;
              }

              await github.rest.issues.create(payload);
              core.info(`Created issue for ${shortSha}`);
            }

      - name: Write reference docs
        if: steps.sync.outputs.has_match == 'true'
        env:
          REPORT_FILE: ${{ steps.sync.outputs.report_file }}
        run: |
          set -euo pipefail

          INDEX_FILE="${DOC_DIR}/README.md"

          mkdir -p "$DOC_DIR"

          if [ ! -f "$INDEX_FILE" ]; then
            {
              echo "# Source Commit Watch Log"
              echo ""
              echo "Auto-generated by \`.github/workflows/poll-and-sync.yml\`."
              echo ""
              echo "| Time (UTC) | Commit | Reason | Reference |"
              echo "|---|---|---|---|"
            } > "$INDEX_FILE"
          fi

          NOW_UTC=$(date -u +"%Y-%m-%d %H:%M:%S")

          jq -c '.[]' "$REPORT_FILE" | while IFS= read -r item; do
            sha=$(echo "$item" | jq -r '.sha')
            short_sha=$(echo "$item" | jq -r '.short_sha')
            msg=$(echo "$item" | jq -r '.message')
            author=$(echo "$item" | jq -r '.author')
            reason=$(echo "$item" | jq -r '.reason')
            source_url=$(echo "$item" | jq -r '.source_commit_url')
            diff_file=$(echo "$item" | jq -r '.diff_file')

            doc_file="${DOC_DIR}/${sha}.md"

            {
              echo "# Source Commit ${short_sha}"
              echo ""
              echo "- Time (UTC): ${NOW_UTC}"
              echo "- SHA: \`${sha}\`"
              echo "- Author: ${author}"
              echo "- Match reason: ${reason}"
              echo "- Source URL: ${source_url}"
              echo ""
              echo "## Commit Message"
              echo ""
              echo "${msg}"
              echo ""
              echo "## Full Diff"
              echo ""
              echo '```diff'
              cat "$diff_file"
              echo '```'
            } > "$doc_file"

            if ! grep -q "$sha" "$INDEX_FILE"; then
              safe_msg=$(echo "$msg" | tr '|' '/' | cut -c1-80)
              echo "| ${NOW_UTC} | \`${short_sha}\` | ${reason} | [${safe_msg}](${sha}.md) |" >> "$INDEX_FILE"
            fi
          done

      - name: Commit reference docs
        if: steps.sync.outputs.has_match == 'true'
        run: |
          set -euo pipefail

          if git diff --quiet -- "$DOC_DIR"; then
            echo "No reference doc changes to commit."
            exit 0
          fi

          git add "$DOC_DIR"
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "docs: add source commit reference records [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Finalize sync checkpoint
        if: success() && steps.sync.outputs.did_poll == 'true' && steps.sync.outputs.fetch_ok == 'true'
        env:
          CHECKPOINT_TIME: ${{ steps.sync.outputs.checkpoint_time }}
          POLLED_EPOCH: ${{ steps.sync.outputs.polled_epoch }}
        run: |
          set -euo pipefail

          if [ -z "$CHECKPOINT_TIME" ]; then
            echo "checkpoint_time is empty"
            exit 1
          fi
          if [ -z "$POLLED_EPOCH" ]; then
            echo "polled_epoch is empty"
            exit 1
          fi

          echo "$CHECKPOINT_TIME" > .sync_state/last_checked_at
          echo "$POLLED_EPOCH" > .sync_state/last_polled_epoch

      - name: Save sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sync_state
          key: sync-state-${{ github.run_id }}
